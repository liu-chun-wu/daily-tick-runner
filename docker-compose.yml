services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SOURCE_URL: local://daily-tick-runner
    image: daily-tick-runner:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      TZ: ${TZ:-Asia/Taipei}
      LOCALE: ${LOCALE:-zh-TW}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    working_dir: /app
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - /app/node_modules

  smoke:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SOURCE_URL: local://daily-tick-runner
    image: daily-tick-runner:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env
    environment:
      NODE_ENV: test
      TZ: ${TZ:-Asia/Taipei}
      LOCALE: ${LOCALE:-zh-TW}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: npm run test:smoke
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
