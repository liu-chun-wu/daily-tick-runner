name: Build & Smoke Test

on:
  workflow_dispatch:
    inputs:
      send_smoke_notification:
        description: Send a success summary to configured Discord/LINE channels
        required: true
        default: true
        type: boolean
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build pull request image without publishing
        run: |
          docker build \
            --build-arg SOURCE_URL="https://github.com/${{ github.repository }}" \
            --tag daily-tick-runner:pr \
            --file docker/Dockerfile \
            .

      - name: Load Playwright configuration without external access
        run: |
          docker run --rm \
            -e BASE_URL=https://example.invalid/ \
            -e COMPANY_CODE=example \
            -e AOA_USERNAME=example \
            -e AOA_PASSWORD=example \
            -e AOA_LAT=0 \
            -e AOA_LON=0 \
            daily-tick-runner:pr npm run test:list

  build-candidate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Fork-owned image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runner"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish candidate SHA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          provenance: false

  smoke:
    if: github.event_name != 'pull_request'
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-candidate.outputs.image }}:sha-${{ github.sha }}
      BASE_URL: ${{ secrets.BASE_URL }}
      COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
      AOA_USERNAME: ${{ secrets.AOA_USERNAME }}
      AOA_PASSWORD: ${{ secrets.AOA_PASSWORD }}
      AOA_LAT: ${{ secrets.AOA_LAT }}
      AOA_LON: ${{ secrets.AOA_LON }}
      TZ: Asia/Taipei
      LOCALE: zh-TW
      LOG_LEVEL: INFO
    steps:
      - name: Check required Secrets
        shell: bash
        run: |
          missing=()
          for name in BASE_URL COMPANY_CODE AOA_USERNAME AOA_PASSWORD AOA_LAT AOA_LON; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Repository Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull exact candidate image
        run: docker pull "$IMAGE"

      - name: Validate candidate image and result handling
        run: |
          docker run --rm --ipc=host \
            -e BASE_URL -e COMPANY_CODE -e AOA_USERNAME -e AOA_PASSWORD \
            -e AOA_LAT -e AOA_LON -e TZ -e LOCALE -e LOG_LEVEL \
            "$IMAGE" npm run test:list
          docker run --rm --ipc=host \
            -e BASE_URL -e COMPANY_CODE -e AOA_USERNAME -e AOA_PASSWORD \
            -e AOA_LAT -e AOA_LON -e TZ -e LOCALE -e LOG_LEVEL \
            "$IMAGE" npm run test:result

      - name: Run login and safe Smoke with candidate image
        if: github.event_name != 'workflow_dispatch' || inputs.send_smoke_notification != true
        run: |
          mkdir -p test-results playwright-report
          docker run --rm --ipc=host \
            -e BASE_URL -e COMPANY_CODE -e AOA_USERNAME -e AOA_PASSWORD \
            -e AOA_LAT -e AOA_LON -e TZ -e LOCALE -e LOG_LEVEL \
            -v "$GITHUB_WORKSPACE/test-results:/app/test-results" \
            -v "$GITHUB_WORKSPACE/playwright-report:/app/playwright-report" \
            "$IMAGE" npm run test:smoke

      - name: Run login and Smoke with notification
        if: github.event_name == 'workflow_dispatch' && inputs.send_smoke_notification == true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          channels=()

          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            channels+=("Discord")
          fi

          if [ -n "${LINE_CHANNEL_ACCESS_TOKEN:-}" ] || [ -n "${LINE_USER_ID:-}" ]; then
            if [ -z "${LINE_CHANNEL_ACCESS_TOKEN:-}" ] || [ -z "${LINE_USER_ID:-}" ]; then
              echo "::error::LINE notification requires both LINE_CHANNEL_ACCESS_TOKEN and LINE_USER_ID"
              exit 1
            fi
            channels+=("LINE")
          fi

          if [ "${#channels[@]}" -eq 0 ]; then
            echo "::error::Smoke notification requested, but no complete Discord or LINE Repository Secrets are configured"
            exit 1
          fi

          echo "Smoke notification channels: ${channels[*]}"
          mkdir -p test-results playwright-report
          docker run --rm --ipc=host \
            -e BASE_URL -e COMPANY_CODE -e AOA_USERNAME -e AOA_PASSWORD \
            -e AOA_LAT -e AOA_LON -e TZ -e LOCALE -e LOG_LEVEL \
            -e DISCORD_WEBHOOK_URL -e LINE_CHANNEL_ACCESS_TOKEN -e LINE_USER_ID \
            -v "$GITHUB_WORKSPACE/test-results:/app/test-results" \
            -v "$GITHUB_WORKSPACE/playwright-report:/app/playwright-report" \
            "$IMAGE" npm run smoke:notify

      - name: Upload failed Smoke evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  promote-latest:
    if: github.event_name != 'pull_request'
    needs:
      - build-candidate
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.build-candidate.outputs.image }}
      CANDIDATE: ${{ needs.build-candidate.outputs.image }}:sha-${{ github.sha }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote tested candidate to latest
        run: |
          docker pull "$CANDIDATE"
          docker tag "$CANDIDATE" "$IMAGE:latest"
          docker push "$IMAGE:latest"
