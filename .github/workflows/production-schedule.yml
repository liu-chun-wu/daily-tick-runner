name: Production Attendance

# Replace these two placeholders before enabling the commented schedule block.
env:
  CHECKIN_CRON: &checkin_cron '<CHECKIN_CRON>'
  CHECKOUT_CRON: &checkout_cron '<CHECKOUT_CRON>'

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: Attendance action
        required: true
        default: checkin
        type: choice
        options:
          - checkin
          - checkout
      log_level:
        description: Log level
        required: true
        default: INFO
        type: choice
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR

  # To enable scheduling, replace both placeholders above and uncomment:
  # schedule:
  #   - cron: *checkin_cron
  #     timezone: Asia/Taipei
  #   - cron: *checkout_cron
  #     timezone: Asia/Taipei

permissions:
  contents: read
  packages: read

concurrency:
  group: production-attendance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKIN_CRON: *checkin_cron
      CHECKOUT_CRON: *checkout_cron
      BASE_URL: ${{ secrets.BASE_URL }}
      COMPANY_CODE: ${{ secrets.COMPANY_CODE }}
      AOA_USERNAME: ${{ secrets.AOA_USERNAME }}
      AOA_PASSWORD: ${{ secrets.AOA_PASSWORD }}
      AOA_LAT: ${{ secrets.AOA_LAT }}
      AOA_LON: ${{ secrets.AOA_LON }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TZ: Asia/Taipei
      LOCALE: zh-TW
      LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
    steps:
      - name: Determine requested action
        id: action
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action_type }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$CHECKIN_CRON" = "$CHECKOUT_CRON" ]; then
            echo "::error::CHECKIN_CRON and CHECKOUT_CRON must be different"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            action="$MANUAL_ACTION"
          elif [ "$SCHEDULE_EXPRESSION" = "$CHECKIN_CRON" ]; then
            action="checkin"
          elif [ "$SCHEDULE_EXPRESSION" = "$CHECKOUT_CRON" ]; then
            action="checkout"
          else
            echo "::error::Schedule does not match CHECKIN_CRON or CHECKOUT_CRON"
            exit 1
          fi
          echo "type=$action" >> "$GITHUB_OUTPUT"

      - name: Check required Secrets
        shell: bash
        run: |
          missing=()
          for name in BASE_URL COMPANY_CODE AOA_USERNAME AOA_PASSWORD AOA_LAT AOA_LON; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Repository Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Resolve Fork-owned image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runner:latest"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull last tested image
        run: docker pull "${{ steps.image.outputs.name }}"

      - name: Run one attendance attempt
        env:
          ACTION_TYPE: ${{ steps.action.outputs.type }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          mkdir -p test-results playwright-report
          docker run --rm --ipc=host \
            -e BASE_URL -e COMPANY_CODE -e AOA_USERNAME -e AOA_PASSWORD \
            -e AOA_LAT -e AOA_LON -e DISCORD_WEBHOOK_URL \
            -e LINE_CHANNEL_ACCESS_TOKEN -e LINE_USER_ID \
            -e TZ -e LOCALE -e LOG_LEVEL \
            -v "$GITHUB_WORKSPACE/test-results:/app/test-results" \
            -v "$GITHUB_WORKSPACE/playwright-report:/app/playwright-report" \
            "$IMAGE" npm run "attendance:$ACTION_TYPE"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Discord on workflow failure
        if: failure()
        env:
          ACTION_TYPE: ${{ steps.action.outputs.type }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl --fail-with-body \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"Attendance workflow failed (${ACTION_TYPE}). See: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi
